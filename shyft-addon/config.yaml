name: "shyft-power"
description: >-
  Home-Energy-Management-System für Home Assistant. Steuere deine großen Stromverbraucher optimal und minimiere so deine Stromkosten - inkl. PV-Prognose, Auto-Anwesenheitsprognose, Wärmepumpen- und Batteriesteuerung.
version: "0.0.45.81"
slug: "shyft_addon"
init: false
# Vorgebaute Multi-Arch-Images aus der GitHub Registry (siehe .github/workflows/builder.yaml).
# {arch} wird von Supervisor/Builder ersetzt. Ohne diesen Key wuerde jeder Nutzer das Add-on
# bei der Installation lokal aus dem Dockerfile bauen.
image: "ghcr.io/shyft-power-com/{arch}-shyft-addon"
arch:
  - aarch64
  - amd64
url: https://www.shyft-power.com/
options:
  shyft_access_key: "notset"
  detailed_logging: false
schema:
  shyft_access_key: password
  detailed_logging: bool
ingress: true
ingress_port: 8080
panel_icon: mdi:home-lightning-bolt-outline
startup: services
boot: auto
host_network: false
hassio_api: true
homeassistant_api: true