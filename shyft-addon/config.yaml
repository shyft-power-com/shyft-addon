name: "shyft-power"
description: >-
  Dein Energy Management System für Home Assistant. Mit diesem Add-on kannst du deine Geräte in Home Assistant unkompliziert von shyft-power steuern lassen und so deine Stromkosten minimieren.
version: "0.0.45.30"
slug: "shyft_addon"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
url: https://www.shyft-power.com/
options:
  shyft_access_key: "notset"
  detailed_logging: false
schema:
  shyft_access_key: password
  detailed_logging: bool
ingress: true
ingress_port: 8080
panel_icon: mdi:home-lightning-bolt-outline
startup: services
boot: auto
host_network: false
hassio_api: true
homeassistant_api: true