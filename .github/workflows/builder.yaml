name: Build add-on images

# Baut die Multi-Arch-Images des shyft-power-Add-ons und pusht sie nach
# ghcr.io/shyft-power-com/<arch>-shyft-addon (siehe image: in shyft-addon/config.yaml).
# Laeuft bei jeder Aenderung am Add-on auf main und test sowie manuell.
#
# "test" ist der Vorabversion-Branch: Aenderungen gehen zuerst dorthin, werden im eigenen
# Home-Assistant-Add-on (Repository-URL dort auf "...#test" umgestellt, siehe README) ausprobiert,
# und erst nach "git merge test" in main auf PROD gepusht. Da slug/image in config.yaml auf beiden
# Branches identisch bleiben, sehen Nutzer, deren Repository-Eintrag (ohne #-Branch) main verfolgt,
# von test gebauten Versionen nichts - Supervisor vergleicht nur gegen die config.yaml des jeweils
# verfolgten Branches, nie gegen "irgendeinen Tag in der Registry".
on:
  push:
    branches: [main, test]
    paths:
      - "shyft-addon/**"
      - ".github/workflows/builder.yaml"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Nur die Architekturen, die der aktuelle home-assistant/builder noch kann und die in
      # shyft-addon/config.yaml stehen. armv7/armhf/i386 sind bei HA raus - "--armv7" wirft im
      # Builder 2026.02.x "Argument unknown".
      matrix:
        arch: [aarch64, amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Haelt fest, von welchem Branch dieses Image gebaut wurde (siehe BUILD_BRANCH im Dockerfile/
      # app.py load_build_branch) - Grundlage fuer den "TESTUMGEBUNG"-Hinweis im Dashboard, der nur
      # auf einem von "test" gebauten Add-on erscheinen soll, niemals auf einem main-Build. Bewusst
      # zur Build-Zeit ermittelt statt als staendiger Unterschied in einer versionierten Datei, damit
      # test und main sich weiterhin konfliktfrei mergen lassen.
      - name: Record build branch
        run: echo "${{ github.ref_name }}" > shyft-addon/BUILD_BRANCH

      # Haengt " (TEST)" an den in Supervisor angezeigten Add-on-Namen an, wenn von "test" gebaut wird -
      # damit ein parallel zu PROD installiertes Test-Add-on auch in der Add-on-Liste/Sidebar klar als
      # solches erkennbar ist. Nur im CI-Checkout geaendert (wie BUILD_BRANCH oben), config.yaml im
      # Git-Quelltext bleibt auf main/test identisch.
      - name: Append TEST suffix to add-on name (test branch only)
        if: github.ref_name == 'test'
        run: |
          sed -i 's/^name: "shyft-power"$/name: "shyft-power (TEST)"/' shyft-addon/config.yaml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bild-Name und Version liest der Builder aus shyft-addon/config.yaml
      # (image: ghcr.io/shyft-power-com/{arch}-shyft-addon, version: ...).
      - name: Build and push ${{ matrix.arch }}
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/shyft-addon \
            --addon
